name: rizio
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [private]

  migrate:
    build: ../backend
    command: [node, dist/migrate.js]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      MQTT_URL: mqtts://emqx:8883
      MQTT_TLS_SERVERNAME: ${MQTT_TLS_SERVERNAME:-mqtt.rizbill.my.id}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [private]

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set encryption key}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Set INTERNAL_SECRET}
      MQTT_URL: mqtts://emqx:8883
      MQTT_TLS_SERVERNAME: ${MQTT_TLS_SERVERNAME:-mqtt.rizbill.my.id}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD}
      MQTT_CA_PATH: ${MQTT_CA_PATH:-}
      FIRMWARE_DIR: /app/storage/firmware
      FIRMWARE_PUBLIC_URL: ${FIRMWARE_BASE_URL}
      TRUST_PROXY: 1
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
    volumes:
      - ${MQTT_CA_FILE:-./certs/ca.crt}:/certs/ca.crt:ro
      - firmware-data:/app/storage/firmware
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [private, edge]

  emqx:
    image: emqx/emqx:5.8.8
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?Set dashboard password}
    volumes:
      - ./emqx/generated.conf:/opt/emqx/etc/emqx.conf:ro
      - ${MQTT_CA_FILE:-./certs/ca.crt}:/opt/emqx/etc/certs/rizio/ca.crt:ro
      - ${MQTT_SERVER_CERT_FILE:-./certs/server.crt}:/opt/emqx/etc/certs/rizio/server.crt:ro
      - ${MQTT_SERVER_KEY_FILE:-./certs/server.key}:/opt/emqx/etc/certs/rizio/server.key:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    ports:
      - '127.0.0.1:${RIZIO_MQTT_PORT:-18883}:8883'
      - '127.0.0.1:${RIZIO_EMQX_DASHBOARD_PORT:-18083}:18083'
    networks:
      private:
      edge:
        aliases:
          - rizio-emqx

  admin:
    build: ../admin/web
    restart: unless-stopped
    networks: [private]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${RIZIO_HTTP_PORT:-18080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, admin]
    networks:
      private:
      edge:
        aliases:
          - rizio-nginx

networks:
  private:
    internal: true
  edge:
    external: true
    name: proxy-net
volumes:
  mysql-data: {}
  emqx-data: {}
  emqx-log: {}
  firmware-data: {}
